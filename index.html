<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crèche Minou — Un monde où les petits grandissent en jouant</title>
<meta name="description" content="Découvrez la Crèche Minou, un espace dédié aux petits de 1 à 4 ans où jouer, découvrir, créer et grandir deviennent chaque jour une nouvelle aventure.">
<meta name="theme-color" content="#FAF3E7">
<meta property="og:type" content="website">
<meta property="og:title" content="Crèche Minou — Un monde où les petits grandissent en jouant">
<meta property="og:description" content="Vous êtes invités à découvrir la Crèche Minou — 15 octobre 2026.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5.3 (grid, utilities, buttons) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Project styles — keep this order, always after Bootstrap -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/background.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/sections.css">
</head>
<body>

<!-- SVG icon sprite (used everywhere with <use href="#icon-…">) -->
<svg class="sprite" aria-hidden="true" focusable="false">
<defs>

  <symbol id="icon-star" viewBox="0 0 64 64">
    <path fill="currentColor" d="M32 4c1.6 0 3 1 3.5 2.6l5.1 15.1 15.9.3c3.6.1 5.1 4.7 2.3 6.9L46 38.7l4.6 15.6c1 3.5-2.9 6.3-5.9 4.3L32 49.1 19.3 58.6c-3 2-6.9-.8-5.9-4.3L18 38.7 5.2 28.9c-2.8-2.2-1.3-6.8 2.3-6.9l15.9-.3 5.1-15.1C29 5 30.4 4 32 4Z"/>
  </symbol>

  <symbol id="icon-cloud" viewBox="0 0 100 60">
    <path fill="currentColor" d="M26 46a18 18 0 0 1-2-35.9A22 22 0 0 1 65.8 15 16 16 0 0 1 84 30.8 15 15 0 0 1 80 46Z"/>
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 64 64">
    <path fill="currentColor" d="M41 6a28 28 0 1 0 17 26.6A22 22 0 0 1 41 6Z"/>
  </symbol>

  <symbol id="icon-balloon" viewBox="0 0 48 72">
    <path fill="currentColor" d="M24 4c11 0 18 9.3 18 20.5S33.6 46 24 46 6 35.7 6 24.5 13 4 24 4Z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M24 46c0 4-2.5 4-2.5 8s3 4 3 8-2.5 4-2.5 8"/>
    <path fill="currentColor" d="M20 46h8l-2.6 6.4a2 2 0 0 1-3.6 0Z" opacity=".85"/>
  </symbol>

  <symbol id="icon-teddy" viewBox="0 0 64 64">
    <circle cx="14" cy="12" r="8" fill="currentColor"/>
    <circle cx="50" cy="12" r="8" fill="currentColor"/>
    <circle cx="32" cy="34" r="24" fill="currentColor"/>
    <circle cx="32" cy="12" r="4" fill="currentColor" opacity=".55"/>
    <circle cx="23" cy="32" r="3.2" fill="#fff" opacity=".9"/>
    <circle cx="41" cy="32" r="3.2" fill="#fff" opacity=".9"/>
    <circle cx="32" cy="40" r="3.4" fill="#fff" opacity=".9"/>
    <path d="M26 46c3.5 3 8.5 3 12 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
  </symbol>

  <symbol id="icon-abc" viewBox="0 0 64 64">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor"/>
    <text x="32" y="43" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="30" fill="#fff" text-anchor="middle">A</text>
  </symbol>

  <symbol id="icon-123" viewBox="0 0 64 64">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor"/>
    <text x="32" y="43" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="28" fill="#fff" text-anchor="middle">5</text>
  </symbol>

  <symbol id="icon-tower" viewBox="0 0 64 64">
    <rect x="6" y="40" width="52" height="16" rx="6" fill="currentColor"/>
    <rect x="14" y="22" width="36" height="16" rx="6" fill="currentColor" opacity=".78"/>
    <rect x="22" y="4" width="20" height="16" rx="6" fill="currentColor" opacity=".55"/>
  </symbol>

  <symbol id="icon-book" viewBox="0 0 72 56">
    <path fill="currentColor" d="M36 12C30 6 18 4 6 6v38c12-2 24 0 30 6 6-6 18-8 30-6V6c-12-2-24 0-30 6Z"/>
    <path d="M36 12v38" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/>
  </symbol>

  <symbol id="icon-puzzle" viewBox="0 0 64 64">
    <path fill="currentColor" d="M8 8h18.5a6 6 0 0 1 11 0H56v18.5a6 6 0 0 1 0 11V56H37.5a6 6 0 0 1-11 0H8V37.5a6 6 0 0 1 0-11Z"/>
  </symbol>

  <symbol id="icon-crayon" viewBox="0 0 64 64">
    <path fill="currentColor" d="m14 38 24-24 12 12-24 24-15 3Z"/>
    <path fill="currentColor" opacity=".55" d="m11 41 12 12-9.5 2.5a3 3 0 0 1-3.7-3.7Z"/>
    <path fill="#fff" opacity=".65" d="m34 18 12 12-4 4-12-12Z"/>
  </symbol>

  <symbol id="icon-paintbrush" viewBox="0 0 64 64">
    <path fill="currentColor" d="M44 4c6 0 10 4 10 10 0 5-3 8-8 12L28 44l-8-8 18-18c4-5 7-8 14-8Z"/>
    <path fill="currentColor" opacity=".55" d="M20 36c4 0 8 2 8 8s-4 10-10 10c-5 0-8-2-10-5 3 0 5-2 5-5s-2-5-2-8c3-1 6 0 9 0Z"/>
  </symbol>

  <symbol id="icon-music" viewBox="0 0 64 64">
    <circle cx="16" cy="48" r="9" fill="currentColor"/>
    <circle cx="42" cy="42" r="9" fill="currentColor"/>
    <path d="M25 48V12l26-6v30" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-speech" viewBox="0 0 64 52">
    <path fill="currentColor" d="M6 10a8 8 0 0 1 8-8h36a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8H30l-13 11.5V38h-3a8 8 0 0 1-8-8Z"/>
  </symbol>

  <symbol id="icon-ball" viewBox="0 0 64 64">
    <circle cx="26" cy="38" r="16" fill="currentColor"/>
    <path d="M44 14c4 6 6 12 4 20M50 10c6 8 8 18 4 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  </symbol>

  <symbol id="icon-plane" viewBox="0 0 64 64">
    <path fill="currentColor" d="M4 34 58 6 36 60l-8-20Z"/>
    <path fill="currentColor" opacity=".55" d="M4 34 28 40l8 20Z"/>
  </symbol>

  <symbol id="icon-pin" viewBox="0 0 48 64">
    <path fill="currentColor" d="M24 2C12 2 3 11.3 3 23c0 16 21 39 21 39s21-23 21-39C45 11.3 36 2 24 2Z"/>
    <circle cx="24" cy="23" r="9" fill="#fff" opacity=".9"/>
  </symbol>

  <symbol id="icon-chat" viewBox="0 0 64 56">
    <path fill="currentColor" d="M32 4C16 4 4 13.8 4 26s12 22 28 22c2.4 0 4.7-.2 6.9-.6L50 52l-2-11.6C54 36.3 60 31.5 60 26 60 13.8 48 4 32 4Z"/>
  </symbol>

  <symbol id="icon-phone" viewBox="0 0 48 48">
    <path fill="currentColor" d="M12 4h10l4 10-6 4c2.4 6 6 9.6 12 12l4-6 10 4v10a4 4 0 0 1-4 4C21.8 42 6 26.2 6 7a4 4 0 0 1 4-4Z"/>
  </symbol>

  <symbol id="icon-insta" viewBox="0 0 48 48">
    <rect x="4" y="4" width="40" height="40" rx="12" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="35" cy="13" r="3" fill="currentColor"/>
  </symbol>

  <symbol id="icon-fb" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="4"/>
    <path fill="currentColor" d="M26.5 40V26h4.6l.8-5.4h-5.4v-3.2c0-1.6.8-2.8 3-2.8h2.5V10c-.6-.1-2.2-.3-4.1-.3-4.2 0-6.8 2.5-6.8 6.9v4H17V26h4.1v14Z"/>
  </symbol>

</defs>
</svg>


<!-- Language switcher: always reachable, even on the envelope screen -->
<div class="lang-switch" role="group" data-i18n-aria="langLabel">
  <button type="button" data-lang="fr" lang="fr">FR</button>
  <button type="button" data-lang="ar" lang="ar">عربي</button>
</div>

<!-- Layered page background -->
<div class="bg-scene" aria-hidden="true">
  <svg class="bg-float far b1" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
  <svg class="bg-float far b2" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
  <svg class="bg-float far b3" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
  <svg class="bg-float far b4" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
  <svg class="bg-float far b5" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
  <svg class="bg-float mid b6" viewBox="0 0 48 72"><use href="#icon-balloon"/></svg>
  <svg class="bg-float mid b7" viewBox="0 0 48 72"><use href="#icon-balloon"/></svg>
  <svg class="bg-float mid b8" viewBox="0 0 64 64"><use href="#icon-abc"/></svg>
  <svg class="bg-float mid b9" viewBox="0 0 64 64"><use href="#icon-123"/></svg>
  <svg class="bg-float mid b10" viewBox="0 0 64 64"><use href="#icon-puzzle"/></svg>
  <svg class="bg-float mid b11" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
  <svg class="bg-float mid b12" viewBox="0 0 64 64"><use href="#icon-tower"/></svg>
</div>

<!-- ============ 1. INTRO (envelope) ============ -->
<section id="intro" class="intro">
  <div class="intro-floaters" aria-hidden="true">
    <svg class="floater p1" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
    <svg class="floater p2" viewBox="0 0 48 72"><use href="#icon-balloon"/></svg>
    <svg class="floater p3" viewBox="0 0 64 64"><use href="#icon-abc"/></svg>
    <svg class="floater p4" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
    <svg class="floater p5" viewBox="0 0 64 64"><use href="#icon-123"/></svg>
    <svg class="floater p6" viewBox="0 0 64 64"><use href="#icon-puzzle"/></svg>
    <svg class="floater p7" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
  </div>

  <div class="envelope-wrap" id="envelopeWrap">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <div class="envelope-stage">
      <div class="env-shadow" aria-hidden="true"></div>
      <div class="env-glow" aria-hidden="true"></div>
      <div class="env-body" aria-hidden="true">
        <svg class="env-deco d1" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
        <svg class="env-deco d2" viewBox="0 0 64 64"><use href="#icon-123"/></svg>
        <svg class="env-deco d3" viewBox="0 0 64 64"><use href="#icon-abc"/></svg>
        <svg class="env-deco d4" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
      </div>
      <div class="env-seal" aria-hidden="true"><span>♥</span></div>
    </div>

    <h1 class="brand-logo" data-i18n="brand"></h1>
    <p class="brand-tagline" data-i18n="tagline"></p>

    <button class="btn btn-minou btn-minou-primary" id="openBtn" type="button">
      <span data-i18n="openInvitation"></span>
      <span class="btn-dot" id="openBtnDot" hidden></span>
    </button>
  </div>
</section>

<!-- ============ SITE (revealed after the envelope opens) ============ -->
<div id="site" aria-hidden="true">

  <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" data-i18n-aria="musicOn" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-music"/></svg>
  </button>
  <audio id="bgAudio" loop preload="none"></audio>

  <!-- ============ 2. INVITATION ============ -->
  <section class="section container-fluid text-center invite-section" id="invitation">
    <svg class="corner c-tl" viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-star"/></svg>
    <svg class="corner c-br" viewBox="0 0 48 72" aria-hidden="true"><use href="#icon-balloon"/></svg>
    <svg class="corner c-tr" viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-abc"/></svg>
    <svg class="corner c-bl" viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-puzzle"/></svg>

    <div class="invite-card reveal">
      <h2 data-i18n="welcome"></h2>
      <p class="invite-brand" data-i18n="brand"></p>
      <p class="invite-text" data-i18n-html="inviteText"></p>

      <div class="invite-details d-flex flex-wrap justify-content-center">
        <div class="detail">
          <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-star"/></svg>
          <div><span class="d-label" data-i18n="labelDate"></span><span class="d-value" data-cfg="date"></span></div>
        </div>
        <div class="detail">
          <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-moon"/></svg>
          <div><span class="d-label" data-i18n="labelTime"></span><span class="d-value" data-cfg="time"></span></div>
        </div>
        <div class="detail" data-needs="address">
          <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#icon-pin"/></svg>
          <div><span class="d-label" data-i18n="labelPlace"></span><span class="d-value" data-cfg="address"></span></div>
        </div>
      </div>

      <a href="#about" class="btn btn-minou btn-minou-primary" data-i18n="discover"></a>
    </div>
  </section>

  <div class="divider reveal" aria-hidden="true"><span class="line"></span><svg viewBox="0 0 64 64"><use href="#icon-star"/></svg><span class="line"></span></div>

  <!-- ============ 3. ABOUT ============ -->
  <section class="section container-fluid text-center about-section" id="about">
    <div class="row about-row">
      <div class="col-md about-illustration reveal" aria-hidden="true">
        <div class="room-frame">
          <svg class="room-icon r1" viewBox="0 0 64 64"><use href="#icon-teddy"/></svg>
          <svg class="room-icon r2" viewBox="0 0 64 64"><use href="#icon-tower"/></svg>
          <svg class="room-icon r3" viewBox="0 0 72 56"><use href="#icon-book"/></svg>
          <svg class="room-icon r4" viewBox="0 0 64 64"><use href="#icon-puzzle"/></svg>
          <svg class="room-icon r5" viewBox="0 0 64 64"><use href="#icon-crayon"/></svg>
          <svg class="room-icon r6" viewBox="0 0 48 72"><use href="#icon-balloon"/></svg>
          <svg class="room-icon r7" viewBox="0 0 64 64"><use href="#icon-abc"/></svg>
        </div>
      </div>
      <div class="col-md about-text reveal">
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutText"></p>
        <ul class="about-points list-unstyled">
          <li data-i18n-html="point1"></li>
          <li data-i18n-html="point2"></li>
          <li data-i18n-html="point3"></li>
        </ul>
      </div>
    </div>
  </section>

  <div class="divider reveal" aria-hidden="true"><span class="line"></span><svg viewBox="0 0 64 64"><use href="#icon-star"/></svg><span class="line"></span></div>

  <!-- ============ 4. GALLERY ============ -->
  <!-- Add a photo: copy one <div class="col-…"> block, change data-full, src and the alt key (see README) -->
  <section class="section container-fluid text-center gallery-section" id="gallery">
    <h2 class="reveal" data-i18n="galleryTitle"></h2>
    <div class="row gallery-row">
      <div class="col-12 col-sm-6 reveal">
        <figure class="g-item g-portrait">
          <button type="button" class="g-open" data-full="assets/images/gallery/pic1.png">
            <img src="assets/images/gallery/pic1.png" width="843" height="626" loading="lazy" decoding="async" data-i18n-alt="alt1"></button>
        </figure>
      </div>
      <div class="col-12 col-sm-6 g-offset reveal">
        <figure class="g-item g-portrait">
          <button type="button" class="g-open" data-full="assets/images/gallery/pic3.png">
            <img src="assets/images/gallery/pic3.png" width="875" height="617" loading="lazy" decoding="async" data-i18n-alt="alt2"></button>
        </figure>
      </div>
      <div class="col-12 reveal">
        <figure class="g-item g-wide mx-auto">
          <button type="button" class="g-open" data-full="assets/images/gallery/pic2.png">
            <img src="assets/images/gallery/pic2.png" width="1448" height="1086" loading="lazy" decoding="async" data-i18n-alt="alt3"></button>
        </figure>
      </div>
    </div>
  </section>

  <!-- ============ 5. EVENT ============ -->
  <section class="section container-fluid text-center event-section" id="event">
    <h2 class="reveal" data-i18n="eventTitle"></h2>
    <div class="event-card reveal">
      <div class="event-row">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-star"/></svg>
        <div><span class="d-label" data-i18n="labelDate"></span><span class="d-value" data-cfg="date"></span></div>
      </div>
      <div class="event-row">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#icon-moon"/></svg>
        <div><span class="d-label" data-i18n="labelTime"></span><span class="d-value" data-cfg="time"></span></div>
      </div>
      <div class="event-row" data-needs="address">
        <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#icon-pin"/></svg>
        <div><span class="d-label" data-i18n="labelPlace"></span><span class="d-value" data-cfg="address"></span></div>
      </div>
      <div class="event-actions d-flex flex-wrap justify-content-center">
        <a class="btn btn-minou btn-minou-outline" data-needs="maps" data-cfg-href="maps" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#icon-pin"/></svg><span data-i18n="seeMap"></span></a>
      </div>
    </div>
  </section>

  <!-- ============ 6. FINALE ============ -->
  <section class="section container-fluid text-center finale-section" id="finale">
    <div class="finale-floaters" aria-hidden="true">
      <svg class="ff f1" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
      <svg class="ff f2" viewBox="0 0 100 60"><use href="#icon-cloud"/></svg>
      <svg class="ff f3" viewBox="0 0 48 72"><use href="#icon-balloon"/></svg>
      <svg class="ff f4" viewBox="0 0 64 64"><use href="#icon-star"/></svg>
    </div>
    <p class="finale-lead reveal" data-i18n="finaleLead"></p>
    <p class="finale-sub reveal" data-i18n="finaleSub"></p>
    <p class="finale-brand reveal" data-i18n="brand"></p>
    <p class="finale-motto reveal" data-i18n="motto"></p>
  </section>

  <!-- ============ 7. CONTACT ============ -->
  <section class="section container-fluid text-center contact-section" id="contact">
    <ul class="contact-list list-unstyled d-flex flex-wrap justify-content-center reveal">
      <li>
        <a href="#" data-needs="phone" data-cfg-href="phone">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icon-phone"/></svg>
          <span data-cfg="phone"></span>
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" data-needs="whatsapp" data-cfg-href="whatsapp">
          <svg viewBox="0 0 64 56" aria-hidden="true"><use href="#icon-chat"/></svg>
          <span>WhatsApp</span>
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" data-needs="instagram" data-cfg-href="instagram">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icon-insta"/></svg>
          <span>Instagram</span>
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" data-needs="facebook" data-cfg-href="facebook">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icon-fb"/></svg>
          <span>Facebook</span>
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" data-needs="maps" data-cfg-href="maps">
          <svg viewBox="0 0 48 64" aria-hidden="true"><use href="#icon-pin"/></svg>
          <span data-cfg="address">—</span>
        </a>
      </li>
    </ul>
  </section>

</div>

<footer class="site-footer text-center">
  <p>© <span id="footerYear"></span> <span data-i18n="brand"></span> — <span data-i18n="rights"></span></p>
</footer>

<!-- Fullscreen photo viewer -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria="viewer" hidden>
  <button type="button" class="lb-btn lb-close" id="lbClose" data-i18n-aria="close">✕</button>
  <button type="button" class="lb-btn lb-prev" id="lbPrev" data-i18n-aria="prev">‹</button>
  <img id="lbImg" alt="">
  <button type="button" class="lb-btn lb-next" id="lbNext" data-i18n-aria="next">›</button>
</div>

<!-- Scripts: plain files, loaded in this order (works when opened by double-click) -->
<script src="assets/js/config.js" defer></script>
<script src="assets/js/i18n/fr.js" defer></script>
<script src="assets/js/i18n/ar.js" defer></script>
<script src="assets/js/modules/dom.js" defer></script>
<script src="assets/js/modules/i18n.js" defer></script>
<script src="assets/js/modules/reveal.js" defer></script>
<script src="assets/js/modules/audio.js" defer></script>
<script src="assets/js/modules/envelope.js" defer></script>
<script src="assets/js/modules/lightbox.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
